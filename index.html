<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Story: Tentang Dewi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #2b2b40;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            max-width: 450px;
        }
        h1 {
            color: #ff85a2;
            margin-bottom: 10px;
        }
        p {
            color: #d1d1e0;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        button {
            background-color: #ff85a2;
            color: #1e1e2f;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover {
            background-color: #ff6b8b;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>?? Tentang Dewi</h1>
        <p>Uji kemampuan bertahan hidupmu dalam percakapan sensitif bersama pacarmu. Pilih jawaban dengan hati-hati!</p>
        <button onclick="mulaiCerita()">Mulai Percakapan</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
